<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="600" height="360" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="300" y="45" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">蘇格拉底追問引導閉環</text>

  <!-- Step 1 -->
  <rect x="50" y="80" width="220" height="85" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="160" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">1. 拋出盲點或困惑</text>
  <text x="160" y="145" text-anchor="middle" font-size="13" fill="#b91c1c">我不懂為什麼這題不能選 B</text>

  <!-- Step 2 -->
  <rect x="330" y="80" width="220" height="85" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="440" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">2. AI 關鍵提問反思</text>
  <text x="440" y="145" text-anchor="middle" font-size="13" fill="#2563eb">不直接給答案，引導看題幹條件</text>

  <!-- Step 3 -->
  <rect x="330" y="225" width="220" height="85" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">3. 自行推理與回答</text>
  <text x="440" y="290" text-anchor="middle" font-size="13" fill="#b45309">重新檢視條件，說出自己的推導</text>

  <!-- Step 4 -->
  <rect x="50" y="225" width="220" height="85" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="160" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">4. 領悟並沉澱閃卡</text>
  <text x="160" y="290" text-anchor="middle" font-size="13" fill="#047857">一鍵將對話精華轉入錯題與閃卡</text>

  <!-- Connecting Arrows -->
  <path d="M 270 122 L 320 122" stroke="#94a3b8" stroke-width="3" fill="none"/>
  <path d="M 440 165 L 440 215" stroke="#94a3b8" stroke-width="3" fill="none"/>
  <path d="M 330 267 L 280 267" stroke="#94a3b8" stroke-width="3" fill="none"/>
  <path d="M 160 225 L 160 175" stroke="#94a3b8" stroke-width="3" fill="none"/>
</svg>
