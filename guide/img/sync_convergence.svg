  <!-- 底部說明 -->
  <text x="300" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">✅ 真正跨裝置無縫切換：在公車上背卡、回書桌前編輯，進度完全同步</text>
</svg>